name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare app
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then cp "$(ls *.html | head -1)" www/index.html; fi
          echo '{"name":"stg-nemlit-reader","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"tz.stgnemlit.reader","appName":"CHARBA STG-2026","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: STG-NEMLIT-Reader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
